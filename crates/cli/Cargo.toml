[package]
name = "gitmove-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gitmove v2 CLI"

[[bin]]
name = "gitmove-core"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gitmove-core = { path = "../core" }
