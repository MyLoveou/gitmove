name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Electron / electron-builder binaries are fetched from GitHub Releases; use a
  # mirror so a 504 from the origin does not fail the build.
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  npm_config_registry: https://registry.npmjs.org

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo version: $version"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $version"
              exit 1
            fi
          fi

  test:
    name: Core tests
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: cargo test
        run: cargo test --all

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm install failed (attempt $i), retrying in 15s"
            Start-Sleep -Seconds 15
          }
          exit 1
      - run: npm run typecheck

  build:
    name: Build installer
    needs: [verify, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build core
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "npm install failed (attempt $i), retrying in 15s"
            Start-Sleep -Seconds 15
          }
          exit 1

      - name: Build renderer
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win nsis --publish never

      - name: Smoke test core
        run: ./target/release/gitmove-core.exe --version

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gitmove-windows-x64
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gitmove-windows-x64
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          git log -1 --pretty=%B > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release exists; recreating it (tag kept)"
            gh release delete "$tag" --yes --cleanup-tag=false || true
          fi
          gh release create "$tag" artifacts/* \
            --title "gitmove v${{ needs.verify.outputs.version }}" \
            --notes-file release-notes.md
