name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo version: $version"
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $version"
              exit 1
            fi
          fi

  test:
    name: Core tests
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: cargo test
        run: cargo test --all

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck

  build:
    name: Build installer
    needs: [verify, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build core
        run: cargo build --release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package installer
        run: npx electron-builder --win nsis --publish never

      - name: Smoke test core
        run: ./target/release/gitmove-core.exe --version

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gitmove-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gitmove-windows-x64
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release delete "$tag" --yes || true
          gh release create "$tag" artifacts/*.exe \
            --title "gitmove v${{ needs.verify.outputs.version }}" \
            --generate-notes
